name: Test Nextflow Pipeline

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]

env:
  NXF_SYNTAX_PARSER: v1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sorters benchmark
            script: tests/test_pipeline_sorters.sh
          - name: Lossy compression benchmark
            script: tests/test_pipeline_lossy.sh
          - name: Existing hybrid datasets
            script: tests/test_pipeline_existing.sh
          - name: Custom sorting cases
            script: tests/test_pipeline_cases.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache
          df -h

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install spikeinterface neuroconv pynwb

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.0"

      - name: Use CI resources
        run: cp .github/workflows/nextflow_test.config pipeline/nextflow_local_custom.config

      - name: Run pipeline
        run: bash ${{ matrix.script }}
